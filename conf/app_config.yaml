logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

# 数据库账号密码通过环境变量注入，默认值仅为本地 docker compose 演示栈凭据
db_meta:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,3306}
  user: ${oc.env:MYSQL_USER,dataagent}
  password: ${oc.env:MYSQL_PASSWORD,dataagent123}
  database: meta

db_dw:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,3306}
  user: ${oc.env:MYSQL_USER,dataagent}
  password: ${oc.env:MYSQL_PASSWORD,dataagent123}
  database: dw

qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: 6333
  embedding_size: 1024
  # 向量召回相似度阈值：过滤低相关字段/指标，降低传入 LLM 的上下文噪音
  score_threshold: ${oc.env:QDRANT_SCORE_THRESHOLD,0.8}

embedding:
  host: localhost
  port: 8081
  model: BAAI/bge-large-zh-v1.5

es:
  host: localhost
  port: 9200
  index_name: data_agent

llm:
  model_name: Pro/zai-org/GLM-5.1
  api_key: ${oc.env:LLM_API_KEY}
  base_url: https://api.siliconflow.cn/v1
